# Shared settings for every ArcDuo build (left, right and dongle).
#
# This file applies even though no shield is literally called "arcduo": ZMK
# strips the trailing _left/_right/_dongle from the shield name and looks for
# <base>.conf as well as <shield>.conf, so both arcduo.conf and e.g.
# arcduo_left.conf are merged. (See ZMK's app/boards/post_boards_shields.cmake.)
# The same rule is why config/arcduo.keymap is found for all three shields.

CONFIG_USB_DEVICE_MANUFACTURER="reentec"
CONFIG_USB_DEVICE_VID=0xA120
CONFIG_USB_DEVICE_PID=0xA240

# Travel power-down, bound to &soft_off on EXTRAS position 25.
#
# Set here rather than per-side because all three units need it for different
# reasons: the dongle to have the behavior at all (it is the only unit running
# the keymap), and each half to be able to enter the state when the dongle tells
# it to.
#
# This is what the halves were missing. They run CONFIG_ZMK_SLEEP=y, but their
# sensors carry `force-awake` and are wakeup sources, so a bag jostling a
# sleeping half wakes it into a full ACTIVE window with the sensor pinned at
# 8 ms sampling. Idle sleep cannot help with that; soft off is a real power-down
# that only a reset-button tap leaves.
CONFIG_ZMK_PM_SOFT_OFF=y
