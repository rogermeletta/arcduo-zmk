# Left half — split peripheral carrying the scroll trackball.
#
# The PMW3610 symbols are prefixed CONFIG_PMW3610_ALT_* because badjeff's
# driver renamed all of them to avoid colliding with the PMW3610 driver that
# Zephyr 4.1 now ships itself. Using the old names is not a harmless no-op:
# Zephyr aborts the build on an assignment to an undefined Kconfig symbol.
#
# Axis inversion and CPI are no longer Kconfig — they are devicetree
# properties on the sensor node, so they can differ per half. See
# boards/shields/arcduo/boards/arcduo_left/nice_nano_nrf52840_zmk.overlay
#
# CONFIG_SPI is deliberately absent: PMW3610_ALT selects it.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING is deliberately absent: that symbol
# only exists on the central, which for ArcDuo is the dongle.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_PMW3610_ALT=y

# Coalesce sensor reports to at most one per 10 ms so the BLE link is not
# flooded, while staying under the sensor's 8 ms sampling interval.
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=10

# The nice!nano needs the sensor's VCC rail to settle before the driver
# probes it, otherwise init fails with "Incorrect product id 0xFF".
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

CONFIG_ZMK_SLEEP=y
