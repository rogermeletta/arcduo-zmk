manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: janpfischer
      url-base: https://github.com/janpfischer
    - name: kot149
      url-base: https://github.com/kot149

  # Revisions are pinned to exact commits on purpose.
  #
  # This repo previously tracked `revision: main` on every project, which is
  # what silently broke it: ZMK moved to Zephyr 4.1 on 2025-12-09 (new HWMv2
  # board targets) and badjeff's PMW3610 driver renamed its compatible to
  # `pixart,pmw3610-alt` to avoid colliding with the driver Zephyr 4.1 now
  # ships itself. Both landed without a single commit here, and CI went red.
  #
  # See https://zmk.dev/blog/2025/06/20/pinned-zmk
  #
  # To upgrade: bump one revision at a time and rebuild.
  projects:
    - name: zmk
      remote: zmkfirmware
      # main @ 2026-08-06. There is no tagged release with Zephyr 4.1 yet:
      # v0.3.0 (2025-08-01) predates it, and v0.4.0 is still an open PR.
      revision: 268b1b1e82150460f00fd701bcd08583d5c75d29
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: badjeff
      # main @ 2026-04-16 — first line carrying the `pixart,pmw3610-alt`
      # compatible and the CONFIG_PMW3610_ALT_* Kconfig prefix.
      revision: 44b4a76b74d293a93cec4ccb7e04cb8d29c10f93
    - name: zmk-dongle-screen
      remote: janpfischer
      # upgrade-4.1 @ 2026-03-12 — YADS's Zephyr 4.1 branch. Its `main` still
      # targets ZMK v0.3 only. Tracked in janpfischer/zmk-dongle-screen#29.
      revision: a8cec2626b8ea94e9a047eac1e53792980369c93
    - name: zmk-scroll-snap
      remote: kot149
      # Axis-locked scrolling for both trackballs; provides &zip_scroll_snap.
      #
      # v1 @ dd21a0f. The README says `revision: v1`, but v1 is a BRANCH -- the
      # repo publishes no tags -- so it is pinned to that branch's head here
      # like everything else in this file. There is also a v1-optimize-scroll-
      # snap branch; it is not this one.
      #
      # Unlike the three projects above, this module states no ZMK or Zephyr
      # version requirement anywhere, so its compatibility with the Zephyr 4.1
      # ZMK pinned above is untested rather than documented. It is a leaf
      # module -- one input processor, referenced only from the two scroll
      # chains in boards/shields/arcduo/arcduo.dtsi -- so if it does not build,
      # dropping this project and the two &zip_scroll_snap lines reverts it.
      revision: dd21a0f71df7f0d2a55017000c6dd0ff0ebd8d6f
  self:
    path: config
