# Right half — split peripheral carrying the cursor trackball.
#
# See config/arcduo_left.conf for why these symbols are CONFIG_PMW3610_ALT_*
# and why axis inversion and CPI now live in devicetree instead. The right
# half's sensor settings are in
# boards/shields/arcduo/boards/arcduo_right/nice_nano_nrf52840_zmk.overlay

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_PMW3610_ALT=y

CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=10
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

CONFIG_ZMK_SLEEP=y
