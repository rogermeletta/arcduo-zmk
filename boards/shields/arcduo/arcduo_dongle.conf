# Dongle — the split central. This is the part that runs the keymap.
#
# The peripheral count now lives in Kconfig.defconfig next to the other
# split settings, so it is not repeated here.
#
# The display module is YADS (janpfischer/zmk-dongle-screen), which replaced
# carrefinho/prospector-zmk-module. Prospector's `main` still targets ZMK
# v0.3 / Zephyr 3.5 only, and the CONFIG_PROSPECTOR_* symbols set here would
# now be undefined — which Zephyr treats as a build error, not a warning.
# YADS's Zephyr 4.1 branch drives the same APDS9960 ambient light sensor.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Ambient light sensor for automatic screen brightness.
# Was CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y

# Brightness ceiling used at power-on and as the auto-brightness maximum.
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80

# Show the macOS glyph for GUI, matching the keymap's LCMD/RCMD usage.
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0

# The dongle is bus-powered, so it should never sleep. (This is idle sleep only;
# CONFIG_ZMK_PM_SOFT_OFF in config/arcduo.conf is a separate, deliberate
# power-down and still applies here -- the dongle is where &soft_off is pressed.)
CONFIG_ZMK_SLEEP=n

# High-resolution scrolling, via the HID resolution multiplier. Both trackballs
# scroll -- the left one on every layer -- and without this the wheel is
# quantised to whole notches, which is the coarsest part of how the balls feel.
#
# Central-only, which is why it is here and not in config/arcduo_{left,right}.
#
# EXPECT TO RETUNE. ZMK's docs describe this as "Enable smooth scrolling HID
# functionality (via HID Resolution Multipliers)" and do not state the
# multiplier, so the effect on the existing divisors -- `zip_scroll_scaler 1 16`
# on the left ball and `1 96` on the right one's Nav override, both in
# boards/shields/arcduo/arcduo.dtsi -- could not be predicted on paper. If
# scrolling comes out much slower than before, those two divisors are the dial;
# if you would rather have the old feel back, this one line is the revert.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
