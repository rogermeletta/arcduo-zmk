# Dongle — the split central. This is the part that runs the keymap.
#
# The peripheral count now lives in Kconfig.defconfig next to the other
# split settings, so it is not repeated here.
#
# The display module is YADS (janpfischer/zmk-dongle-screen), which replaced
# carrefinho/prospector-zmk-module. Prospector's `main` still targets ZMK
# v0.3 / Zephyr 3.5 only, and the CONFIG_PROSPECTOR_* symbols set here would
# now be undefined — which Zephyr treats as a build error, not a warning.
# YADS's Zephyr 4.1 branch drives the same APDS9960 ambient light sensor.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Ambient light sensor for automatic screen brightness.
# Was CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y

# Brightness ceiling used at power-on and as the auto-brightness maximum.
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80

# Show the macOS glyph for GUI, matching the keymap's LCMD/RCMD usage.
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0

# The dongle is bus-powered, so it should never sleep.
CONFIG_ZMK_SLEEP=n
