# Dongle — the split central. This is the part that runs the keymap.
#
# The peripheral count now lives in Kconfig.defconfig next to the other
# split settings, so it is not repeated here.
#
# The display module is YADS (janpfischer/zmk-dongle-screen), which replaced
# carrefinho/prospector-zmk-module. Prospector's `main` still targets ZMK
# v0.3 / Zephyr 3.5 only, and the CONFIG_PROSPECTOR_* symbols set here would
# now be undefined — which Zephyr treats as a build error, not a warning.
# YADS's Zephyr 4.1 branch drives the same APDS9960 ambient light sensor.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Ambient light sensor for automatic screen brightness.
# Was CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y

# Brightness ceiling used at power-on and as the auto-brightness maximum.
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80

# Show the macOS glyph for GUI, matching the keymap's LCMD/RCMD usage.
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0

# The dongle is bus-powered, so it should never sleep. (This is idle sleep only;
# CONFIG_ZMK_PM_SOFT_OFF in config/arcduo.conf is a separate, deliberate
# power-down and still applies here -- the dongle is where &soft_off is pressed.)
CONFIG_ZMK_SLEEP=n

# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING is deliberately NOT set. It was enabled
# here and reverted: it broke click-and-drag, which is how text gets selected.
#
# Do not re-add it without reading this. The symptom was that holding left click
# and moving the cursor ball no longer selected text, while clicking alone and
# moving alone both still worked. Nothing in the keymap was involved -- the
# compiled devicetree of the two builds is identical across the whole BASE
# layer, `lclk_nav` included -- and the firmware side cannot be at fault either:
# the resolution multiplier reaches only `wheel` and `hor_wheel` and never
# touches d_x, d_y or the button flags (app/src/pointing/resolution_multipliers.c).
#
# What it does touch is what the HOST sees. Enabling it rewrites the mouse HID
# report descriptor, inserting Resolution Multiplier feature items into the wheel
# collections (app/include/zmk/hid.h), and adds a feature-report characteristic
# to the BLE HID service (app/src/hog.c). Both are cached per-bond by macOS, so a
# reflash changes the descriptor and shifts GATT attribute handles underneath a
# host that is still using the versions it cached at pairing time.
#
# If it is ever wanted, the way in is to enable it and then remove and re-pair
# the host, forcing fresh service discovery -- not to enable it and reflash.
# The scroll divisors would need retuning at the same time, since ZMK does not
# document the multiplier it uses.
