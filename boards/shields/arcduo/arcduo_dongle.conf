# Dongle — the split central. This is the part that runs the keymap.
#
# The peripheral count now lives in Kconfig.defconfig next to the other
# split settings, so it is not repeated here.
#
# The display module is YADS (janpfischer/zmk-dongle-screen), which replaced
# carrefinho/prospector-zmk-module. Prospector's `main` still targets ZMK
# v0.3 / Zephyr 3.5 only, and the CONFIG_PROSPECTOR_* symbols set here would
# now be undefined — which Zephyr treats as a build error, not a warning.
# YADS's Zephyr 4.1 branch drives the same APDS9960 ambient light sensor.

CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# Ambient light sensor for automatic screen brightness.
# Was CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=y.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y

# Brightness ceiling used at power-on and as the auto-brightness maximum.
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80

# Show the macOS glyph for GUI, matching the keymap's LCMD/RCMD usage.
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=0

# The dongle is bus-powered, so it should never sleep. (This is idle sleep only;
# CONFIG_ZMK_PM_SOFT_OFF in config/arcduo.conf is a separate, deliberate
# power-down and still applies here -- the dongle is where &soft_off is pressed.)
CONFIG_ZMK_SLEEP=n

# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING is not set, but NOT for the reason this
# comment first gave. It was enabled, then reverted on the suspicion that it had
# broken click-and-drag. It had not. The actual cause was `lclk_nav` on position
# 31 -- a hold-tap whose hold branch raised NAV, so holding the key never held a
# mouse button, and NAV is the layer that swaps the right ball to scrolling.
# That is fixed in the keymap; this was a bystander.
#
# It stays off only because nobody has asked for high-resolution scrolling and
# because turning it on is a re-pair event, which is the part worth keeping:
# enabling it rewrites the mouse HID report descriptor, inserting Resolution
# Multiplier feature items into the wheel collections (app/include/zmk/hid.h),
# and adds a feature-report characteristic to the BLE HID service
# (app/src/hog.c). macOS caches both the report map and the GATT database per
# bond, so a plain reflash moves them under a host still using what it cached at
# pairing time.
#
# So it is safe to try: enable it, reflash, then remove and re-pair the host to
# force fresh service discovery. The scroll divisors in
# boards/shields/arcduo/arcduo.dtsi would want retuning at the same time, since
# ZMK does not document the multiplier it uses.
