draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: auto
  n_columns: 1
  separate_combo_diagrams: true
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: true
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  # Styling for the two integrated trackballs, which come into the diagram as
  # keys carrying `type: ball` (see raw_binding_map below). Drawing them round
  # is the whole point: they are input devices, not keys, and a rounded square
  # in the split gap would just read as another key.
  #
  # SVG clamps rx/ry to half the width, so 999px simply means "fully round".
  # draw_key_sides is on, which gives every key an outer and a slightly
  # smaller inner rect -- once both are circles that reads as a ball sitting
  # in its socket, and rect.side's brightness(90%) shades the socket for free.
  # The separate combo diagrams redraw the whole board from scratch, out of
  # plain type-less keys, so `.ball` does not exist there -- and they prepend
  # the combo's own legend box as position 0, which shifts every board key up
  # by one. That is the only reason the balls have to be named twice, and by
  # index: keypos-36/37 in the layer diagrams, keypos-37/38 in the combo ones.
  # If the layout ever gains or loses a key, these numbers move with it.
  svg_extra_style: |
    rect.key.ball,
    g[class^="layer-combopos"] g.keypos-37 rect.key,
    g[class^="layer-combopos"] g.keypos-38 rect.key {
        rx: 999px;
        ry: 999px;
        fill: #dbe6f2;
    }
    @media (prefers-color-scheme: dark) {
    rect.key.ball,
    g[class^="layer-combopos"] g.keypos-37 rect.key,
    g[class^="layer-combopos"] g.keypos-38 rect.key { fill: #3d5674; }
    }
  footer_text: ""
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  # Legends for bindings keymap-drawer cannot name on its own.
  #
  # This used to live as a KEYMAP_raw_binding_map env var inside the vendored
  # copy of the draw workflow, where most of it was stale: it mapped `&msc
  # MOVE_UP` (this keymap uses `&msc SCRL_*`), and behaviours that no longer
  # exist (&td_cursor, &td_layers, &td_clk_scrl, &h_split, &v_split, tmux
  # macros), while missing the tap-dances actually in use -- which is why
  # `&td_tab` renders literally in keymap-drawer/arcduo.yaml today.
  raw_binding_map:
    "&td_tab": {t: TAB, h: Num}
    "&td_space": {t: SPACE, h: Nav}
    "&td_bs": {t: BSPC, h: Num}
    "&td_grave": "`"
    "&td_hyphen": "-"
    "&td_equals": "="
    "&td_bore": {t: Base, h: Extra}
    "&caps_word": Caps Word
    "&studio_unlock": ZMK Studio
    "&bootloader": Bootloader
    "&shrug": '¯\_(ツ)_/¯'
    "&lgtm": LGTM
    "&gcm": git commit
    "&sudo": sudo !!
    "&new_dir": New Dir
    "&mkp LCLK": L Click
    "&mkp RCLK": R Click
    "&mkp MCLK": M Click
    "&mkp MB4": Back
    "&mkp MB5": Forward
    "&mmv MOVE_UP": Move ↑
    "&mmv MOVE_DOWN": Move ↓
    "&mmv MOVE_LEFT": Move ←
    "&mmv MOVE_RIGHT": Move →
    "&msc SCRL_UP": Wheel ↑
    "&msc SCRL_DOWN": Wheel ↓
    "&msc SCRL_LEFT": Wheel ←
    "&msc SCRL_RIGHT": Wheel →
    # The two trackballs. Not real behaviours: they come from the
    # `#ifdef KEYMAP_DRAWER` bindings at the end of every layer in
    # config/arcduo.keymap, which only the drawer's preprocessor sees. Their
    # real behaviour is the input-listener chains in
    # boards/shields/arcduo/arcduo.dtsi -- keep the two in sync.
    #
    # `type: ball` is the hook for the round styling in svg_extra_style above.
    # Left ball scrolls, right ball moves the cursor. On Nav the two swap, as
    # they do on the UHK's Mod layer; on Mouse the cursor ball drops to
    # quarter speed for sniping.
    "&ball_scroll": {t: Scroll, type: ball}
    "&ball_cursor": {t: Cursor, type: ball}
    "&ball_snipe": {t: Snipe ¼×, type: ball}
    # Umlaut macros carried over from the UHK's Fn layer.
    "&ae_macro": ä
    "&oe_macro": ö
    "&ue_macro": ü
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  mark_alternate_layer_activators: false
  # macOS names, matching both the keycaps and the way the UHK Agent labels
  # these keys (LCmd / LOption in its own UI). The keymap is a macOS keymap;
  # rendering LG() as "Gui" made the carried-over UHK chords needlessly hard
  # to read against the shortcuts they came from.
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Opt
    right_alt: AGr
    left_gui: Cmd
    right_gui: Cmd
    keycode_combiner: "{mods}+{key}"
    mod_combiner: "{mod_1}+{mod_2}"
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
    - KC_
  qmk_keycode_map:
